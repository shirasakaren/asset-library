# =============================================================================
# MGM Asset Library — local development stack (monorepo).
#
# Brings up the full system in one compose file:
#   * infrastructure — Postgres, MongoDB, Redis, Meilisearch, MinIO
#   * backend API     — built from backend/Dockerfile
#   * worker          — built from backend/Dockerfile.worker (heavy toolchain)
#   * web             — built from frontend/Dockerfile (Next.js)
#
# Usage:
#   cp backend/.env.example backend/.env       # fill in values
#   cp frontend/.env.example frontend/.env.local
#   docker compose up -d --build
#
# Production runs prebuilt images only — see docker-compose.prod.yml.
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file: backend/.env
    environment:
      PROCESS_ROLE: worker
      PORT: '4001'
    ports:
      - '4001:4001' # /healthz + /metrics
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    # Blender allocates a lot of VRAM-shaped temp buffers; keep tmpfs cheap.
    tmpfs:
      - /tmp/mgm-analyze:size=4g

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: mgm-asset-library-frontend:local
    env_file: frontend/.env.local
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mgm
      POSTGRES_PASSWORD: mgm
      POSTGRES_DB: mgm_asset_library
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mgm -d mgm_asset_library']
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand(\'ping\').ok']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_NO_ANALYTICS: 'true'
      MEILI_ENV: development
    ports:
      - '7700:7700'
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:7700/health']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: mgm
      MINIO_ROOT_PASSWORD: mgm-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  mongo_data:
  redis_data:
  meili_data:
  minio_data:
